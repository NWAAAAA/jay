<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Space Marines Recruitment</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="enemy.html">Enemy Factions</a></li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
  </nav>

  <section>
    <h1>Apply to Join the Space Marines</h1>
    <form id="applyForm">
      <input type="text" id="name" placeholder="Full Name" required /><br/>
      <input type="email" id="email" placeholder="Email" required /><br/>
      <input type="password" id="password" placeholder="Password" required /><br/>
      <input type="text" id="chapter" placeholder="Chapter Name" required /><br/>
      <button type="submit">Apply</button>
    </form>
    <p id="applyMessage"></p>
  </section>

  <section>
    <h2>Already a Marine?</h2>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required /><br/>
      <input type="password" id="loginPassword" placeholder="Password" required /><br/>
      <button type="submit">Login</button>
    </form>
    <p id="loginMessage"></p>
  </section>

  <img src="space_marine.jpg" alt="Space Marine" width="300" />

  <script src="script.js"></script>
</body>
</html>
