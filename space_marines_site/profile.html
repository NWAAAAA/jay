<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Profile</title><link rel="stylesheet" href="styles.css"></head>
<body>
<nav>
<ul><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="enemy.html">Enemy Factions</a></li><li><a href="profile.html">Profile</a></li></ul>
</nav>
<section>
<h1>Your Space Marine Profile</h1>
<div id="profileData"><p>Loading your details...</p></div>
</section>
<script>
fetch("backend/profile.php").then(res => res.json()).then(data => {
const container = document.getElementById("profileData");
if (data.success) {
container.innerHTML = `<p><strong>Name:</strong> ${data.user.name}</p>
<p><strong>Email:</strong> ${data.user.email}</p>
<p><strong>Chapter:</strong> ${data.user.chapter}</p>`;
} else {
container.innerHTML = `<p>${data.message}</p>`;
}
}).catch(() => {
document.getElementById("profileData").innerHTML = '<p>Failed to load profile.</p>';
});
</script>
</body></html>
